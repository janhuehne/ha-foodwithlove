remove_weekplan_meal:
  name: Remove week plan meal
  description: Remove a catalog recipe or custom entry from the food with love week plan for a given day.
  fields:
    date:
      name: Date
      description: Calendar day of the meal (YYYY-MM-DD).
      required: true
      example: "2026-10-25"
      selector:
        date:
    recipe_id:
      name: Recipe ID
      description: Catalog recipe id (required for normal recipes).
      example: rTi6KZH63rUZQRInqe7T
      selector:
        text:
    title:
      name: Custom title
      description: Title of a custom weekplan entry (when custom is true).
      selector:
        text:
    custom:
      name: Custom entry
      description: Set true for free-text custom meals (not catalog recipes).
      default: false
      selector:
        boolean:

add_weekplan_meal:
  name: Add week plan meal
  description: Add a catalog recipe or custom entry to the food with love week plan for a given day.
  fields:
    date:
      name: Date
      description: Calendar day of the meal (YYYY-MM-DD).
      required: true
      example: "2026-10-25"
      selector:
        date:
    recipe_id:
      name: Recipe ID
      description: Catalog recipe id (required for normal recipes).
      example: rTi6KZH63rUZQRInqe7T
      selector:
        text:
    title:
      name: Custom title
      description: Title of a custom weekplan entry (when custom is true).
      selector:
        text:
    custom:
      name: Custom entry
      description: Set true for free-text custom meals (not catalog recipes).
      default: false
      selector:
        boolean:

create_favorite_folder:
  name: Create favorite folder
  description: Create an empty favorite folder.
  fields:
    name:
      name: Name
      description: Folder display name.
      required: true
      example: Desserts
      selector:
        text:

delete_favorite_folder:
  name: Delete favorite folder
  description: Delete a favorite folder. Fails if the folder still contains recipes.
  fields:
    folder_id:
      name: Folder ID
      description: Firestore document id of the folder.
      required: true
      selector:
        text:

move_favorite:
  name: Move favorite
  description: Move a favorited recipe into a folder, or omit folder_id for uncategorized.
  fields:
    recipe_id:
      name: Recipe ID
      description: Catalog recipe id.
      required: true
      selector:
        text:
    folder_id:
      name: Folder ID
      description: Target folder id, or leave empty for "Ohne Ordner".
      selector:
        text:
